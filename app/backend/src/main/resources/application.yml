server:
  port: ${SERVER_PORT:8000}

app:
  api-doc-enable: true

spring:
  application:
    name: employee-policy-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/policydb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.1
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: false
        
springdoc:
  api-docs:
    enabled: ${app.api-doc-enable}
  swagger-ui:
    enabled: ${app.api-doc-enable}
    path: /api-docs

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

logging:
  level:
    root: INFO
    com.company.policyrag: DEBUG
    org.springframework.ai: INFO
    org.springframework.security: INFO
